<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SecureWebOps | DevSecOps Demo App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      text-align: center;
      max-width: 600px;
      padding: 2rem;
    }
    h1 { color: #58a6ff; font-size: 2rem; margin-bottom: 0.5rem; }
    .subtitle { color: #8b949e; margin-bottom: 2rem; }
    .badge {
      display: inline-block;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 0.4rem 0.8rem;
      margin: 0.3rem;
      font-size: 0.85rem;
    }
    .badge.green { border-color: #3fb950; color: #3fb950; }
    .footer { margin-top: 2rem; color: #8b949e; font-size: 0.8rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔐 SecureWebOps</h1>
    <p class="subtitle">Deployed via hardened DevSecOps pipeline on AWS EC2</p>

    <div>
      <span class="badge green">✓ Checkov IaC Scan Passed</span>
      <span class="badge green">✓ Bandit SAST Passed</span>
      <span class="badge green">✓ OWASP ZAP DAST Passed</span>
      <span class="badge green">✓ IMDSv2 Enforced</span>
      <span class="badge green">✓ EBS Encrypted</span>
      <span class="badge green">✓ OIDC Auth (No Static Keys)</span>
    </div>

    <div class="footer">
      Built by Moses Daniel · Cloud Security & DevSecOps Engineer
    </div>
  </div>
</body>
</html>
